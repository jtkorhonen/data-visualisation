# Settings of the visualisation style that a Matplotlib style sheet cannot express.
# Read by scripts/figure_style.py next to visualisation.mplstyle; lengths in points.

figure_frame_linewidth: 1.16  # frame color is figure.edgecolor in the style sheet; 0 = no frame
ylabel_rotation: 0  # degrees; 0 = horizontal
ylabel_labelpad: 6  # pt between the tick labels and the y-axis label
ylabel_horizontal_alignment: left
ylabel_vertical_alignment: bottom
title_pad_in_ylabel_heights: 2  # title padding above the axes, as a multiple of the y-label font size
